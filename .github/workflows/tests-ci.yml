name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  spelling:
    name: Spelling
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check spelling
        run: npm run spell

  lint:
    name: Linting
    runs-on: ubuntu-slim
    # Wait for first job (for dep cache)
    needs: spelling
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Do linting
        run: npm run lint
