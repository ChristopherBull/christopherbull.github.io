[settings]
ruby.compile = false

[tools]
node = { version = "24", postinstall = "npm ci" }
ruby = { version = "3.3.9", postinstall = "bundle config set --local path 'vendor/bundle'; bundle install" }

[tasks.serve]
description = "Build and serve the site locally (binds 0.0.0.0 for devcontainer)"
run = "bundle exec jekyll serve --host 0.0.0.0"

[tasks.install-deps]
description = "Install project dependencies from lockfiles"
run = [
  "npm ci",
  # `postinstall` runs on tool install/update, but if tools come from cached/mounted volume, then the local bundle vendor may have not been configured.
  "bundle config set --local path 'vendor/bundle'",
  "bundle install"
]

[tasks.check-deps]
description = "List outdated dependencies and run security audits (npm + Ruby)"
# Each tool exits non-zero when it finds something, so run them all and fail at the end rather than stopping at the first.
# bundler-audit is run via `gem exec` to avoid adding it to the Gemfile (which would be deployed with the site's dependencies).
run = '''
status=0
echo "==> mise outdated"; mise outdated --bump || true
echo "==> npm outdated";   npm outdated || true
echo "==> bundle outdated"; bundle outdated || true
echo "==> npm audit";       npm audit || status=1
echo "==> bundler-audit";   gem exec bundler-audit check --update || status=1
exit $status
'''
